

<div>

    <div style="width: 50%; display: inline-block;">
        <app-form-get-product-by-id [(selectedProduct)]="productSelected"/>
    </div>

    <div style="width: 50%; display: inline-block;">
        
        @if(productSelected() === undefined){
            <p>no product selected.</p>
        }
        @else {
            <table>
                <thead>
                    <tr>
                        <th>id</th>
                        <th>name</th>
                        <th>price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>{{ productSelected()?.id }}</td>
                        <td>{{ productSelected()?.name }}</td>
                        <td>{{ productSelected()?.price | currency:'EUR':'symbol':'1.2-2':'fr-FR' }}</td>
                    </tr>
                </tbody>
            </table>
        }
    </div>

</div>
