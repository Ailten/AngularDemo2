

<div>

    <div style="width: 50%; display: inline-block;">
        <app-form-get-product-by-id [(selectedProduct)]="productToUpdate"/>
        <!-- connect a formGroup to a model -->
    </div>

    <div style="width: 50%; display: inline-block;">

        <form [formGroup]="productForm" (submit)="update($event)">

            <div>
                <label for="name">name :</label>
                <input type="text" id="name" formControlName="name"/>
            </div>

            <div>
                <label for="price">price :</label>
                <input type="number" id="price" formControlName="price"/>
            </div>

            <button type="submit" [disabled]="!this.productForm.value.id">Update</button>

        </form>

    </div>

</div>
